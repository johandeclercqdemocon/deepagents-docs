[project]
name = "deepagents-book"
version = "1.0.0"
description = "Runnable examples for the book 'Deep Agents: From First Harness to Production'"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7,<1",
    "langchain>=1.3,<2",
    "langgraph>=1.2,<2",
]

# Only for the chapters that call a real model. Everything else runs offline, free.
[project.optional-dependencies]
real-model = ["langchain-anthropic>=1.7"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["examples"]
